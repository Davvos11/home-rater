apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-rater
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      containers:
        - name: app
          image: app # replaced by kustomize
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: home-rater-env
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
      # Only for private GHCR images (ghcr_pull_secret = true in infra-tg):
      # imagePullSecrets:
      #   - name: ghcr-pull
