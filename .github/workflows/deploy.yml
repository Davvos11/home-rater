name: build and deploy

# Deploys only from master. There is deliberately no pull_request trigger: the deploy job runs
# on a self-hosted runner inside the cluster.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP: home-rater
  KUBECTL_VERSION: v1.36.5
  KUBECTL_SHA256: 33bc88a24c3b09cf55bfd59e6ca977881b61fc3f25ab65bc80c65b430248648e
  KUSTOMIZE_VERSION: v5.8.3
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # ARC runner scale set registered to this repo; runs as the namespace's deployer ServiceAccount.
    runs-on: zonnestralen
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl and kustomize
        run: |
          mkdir -p "$HOME/bin"
          cd "$HOME/bin"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl
          tarball="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tarball}"
          echo "${KUSTOMIZE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" kustomize && rm "$tarball"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Deploy
        working-directory: k8s
        run: |
          kustomize edit set image "app=${{ needs.build.outputs.image }}:${{ github.sha }}"
          kubectl apply -k .
          kubectl rollout status "deployment/${APP}" -n "${APP}" --timeout=5m
