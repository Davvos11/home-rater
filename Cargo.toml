[package]
name = "home-rater"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenv = "0.15.0"
google_maps = "3.7.4"
tokio = { version = "1.0.0", features = ["rt", "rt-multi-thread", "macros"] }
thiserror = "2.0.6"
axum = "0.8.0"
tower = "0.5.2"
tower-http = { version = "0.7.0", features = ["cors"] }
serde = { version = "1.0.216", features = ["derive"] }